name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-24.04
    container: archlinux:base@sha256:b21322c663be387c0ed9cbc7bbbfe18e41633ad4e7b7c77cfad45f128be20040
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install native test dependencies
        run: |
          pacman -Syu --noconfirm --needed python python-gobject gtk4 libadwaita ffmpeg ttf-dejavu
          /usr/bin/python -m venv --system-site-packages .ci-venv
          .ci-venv/bin/python -m pip install ruff==0.14.5
      - name: Lint
        run: .ci-venv/bin/ruff check lumen tests scripts
      - name: Unit and FFmpeg integration tests
        run: /usr/bin/python -m unittest discover -s tests -v
